{% extends "base.html" %}

{% block title %}Poll Manager Login{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="poll-card card">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill fs-1 text-danger"></i>
                            <h1 class="h3 mt-3">Poll manager login</h1>
                            <p class="text-muted mb-0">Use the current Django superuser credentials.</p>
                        </div>
                        <form method="post" class="row g-3">
                            {% csrf_token %}
                            <div class="col-12">
                                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                                {{ form.username }}
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                                {{ form.password }}
                            </div>
                            <div class="col-12 d-grid">
                                <button class="btn btn-ulk" type="submit">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Enter dashboard
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
