<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffffff, #2196f3);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        header {
            background: #333333;
            padding: 15px 0;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            /* helps responsiveness */
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #00bcd4;
        }

        /* ===== MAIN CONTENT ===== */
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px 20px;
            flex-wrap: wrap;
            /* allows wrapping */
        }

        .card {
            flex: 1 1 300px;
            /* responsive sizing */
            max-width: 350px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background: white;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card p {
            text-align: center;
            padding: 15px;
            font-size: 18px;
        }

        /* ===== FOOTER ===== */

        footer {
            margin-top: auto;
            /* Pushes footer to the bottom */
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;

        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 5px;
        }

        footer a:hover {
            color: #00bcd4;
        }


        /* ===== MEDIA QUERIES ===== */

        /* Tablet */
        @media (max-width: 900px) {
            .container {
                gap: 20px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .card {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Service</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <!-- Main Section -->
    <div class="container">

        <div class="card">
            <img src="imgs/img1.jpg" alt="Image 1">
            <p>Description </p>
        </div>

        <div class="card">
            <img src="imgs/img2.jpg" alt="Image 2">
        </div>

        <div class="card">
            <img src="imgs/img3.jpg" alt="Image 3">
        </div>

    </div>
    <!-- Footer -->
    <footer>
        <a href="#">Tokyo</a>
        <a href="#">London</a>
        <a href="#">Paris</a>
    </footer>
</body>

</html>
