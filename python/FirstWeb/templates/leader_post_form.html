<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | ULK Voting Portal</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(180deg, #fffaf1, #f0e4cc);
            color: #14213d;
        }
        .wrap { max-width: 820px; margin: 0 auto; padding: 36px 24px; }
        .card {
            background: white;
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 16px 35px rgba(20, 33, 61, 0.08);
        }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            border-radius: 12px;
            border: 1px solid #cfd7e3;
            font: inherit;
        }
        button, a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: bold;
            text-decoration: none;
        }
        button {
            border: none;
            cursor: pointer;
            background: #a32020;
            color: white;
        }
        a { color: #a32020; }
        .errorlist {
            color: #a32020;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>{{ page_title }}</h1>
            <p>Publish a leadership update and define the two choices students can vote on.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Save post</button>
            </form>
            <a href="/leader/dashboard/">Back to dashboard</a>
        </div>
    </div>
</body>
</html>
