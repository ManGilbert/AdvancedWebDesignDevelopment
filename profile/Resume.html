<!DOCTYPE html>
<html>
<head>
    <title>Resume</title>
    <style>
        body {
            background-color: grey;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        .profile {
            text-align: center;
            margin: 20px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border: 3px solid blue;
        }

        .bio {
            text-align: center;
            font-size: 18px;
        }

        .social {
            text-align: center;
            margin-bottom: 30px;
        }

        .social a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 50%;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        .cyber {
            background-color: #d0e7ff;
        }

        .web {
            background-color: #e6f2ff;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>RESUME</h1>

    <div class="profile">
        <img src="profile.jpeg" alt="Your Profile Picture">
    </div>

    <div class="bio">
        <p><strong>Bio:</strong> I am a passionate IT student interested in cybersecurity and web development.</p>
    </div>

    <div class="social">
        <p>Connect with me:
            <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
        </p>
    </div>

    <h2>Year 4 Transcripts</h2>

    <table>
        <tr>
            <th>Module</th>
            <th>Marks (%)</th>
            <th>Grade</th>
        </tr>
        <tr class="cyber">
            <td>Cybersecurity</td>
            <td>80</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Introduction</td>
            <td>70</td>
            <td>B</td>
        </tr>
        <tr class="web">
            <td>Web</td>
            <td>75</td>
            <td>B</td>
        </tr>
    </table>

</body>
</html>
